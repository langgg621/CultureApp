version: '3.8'

services:
  app:
    build: .
    container_name: cultureapp_api
    restart: always
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - DB_HOST=mysql
      - DB_USER=root
      - DB_PASSWORD=${DB_PASSWORD:?DB_PASSWORD is required}
      - DB_NAME=${DB_NAME:-CultureApp}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
    depends_on:
      - mysql
      - redis
    networks:
      - cultureapp_network

  mysql:
    image: mysql:8.0
    container_name: cultureapp_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      MYSQL_DATABASE: ${DB_NAME:-CultureApp}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init:/docker-entrypoint-initdb.d
    networks:
      - cultureapp_network

  redis:
    image: redis:alpine
    container_name: cultureapp_redis
    restart: always
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    networks:
      - cultureapp_network

volumes:
  mysql_data:
  redis_data:

networks:
  cultureapp_network:
    driver: bridge